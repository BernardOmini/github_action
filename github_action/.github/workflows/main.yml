name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: YOUR_ROLE_ARN
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build Docker image
        run: docker build -t 965984381744.dkr.ecr.us-east-1.amazonaws.com/github-action-app:latest .

      - name: Push Docker image to Amazon ECR
        run: docker push 965984381744.dkr.ecr.us-east-1.amazonaws.com/github-action-app:latest